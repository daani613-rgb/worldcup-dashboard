  .verdict.silent{background:#1e2128;color:var(--silent);border:1px solid var(--line)}

  .probs{direction:ltr}
  .bar-h{background:var(--home)} .bar-d{background:var(--draw)} .bar-a{background:var(--away)}

  .so{background:#f0a020} .sd{background:var(--draw)} .sf{background:var(--mut)}

  .sbig{font-size:2rem;font-weight:700;color:#f0a020;line-height:1.1}
  .srow{display:flex;justify-content:space-between;font-size:.78rem;margin:5px 0 2px}
  .smini{height:7px;border-radius:4px;background:#0c0e12;overflow:hidden;direction:ltr}
  .probs{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut);margin-top:5px}
  .probs span b{color:var(--txt)}
  .result{margin-top:8px;font-size:.82rem;padding-top:8px;border-top:1px solid var(--line)}
  .ok{color:var(--call)} .miss{color:var(--away)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--mut);margin:6px 0 14px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
  footer{color:var(--mut);font-size:.75rem;margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
  details{margin-top:8px} summary{cursor:pointer;color:var(--mut)}

          `<div style="font-size:.8rem;margin-top:9px">${L.surpriseNotlose.replace("{dog}",si.dog)} <b>${nl}%</b></div>`+
        `</div>`+
        // (4) למה · (5) סייג · (6) ביסוס
        `<div style="font-size:.8rem;color:var(--mut)">${L.surpriseWhy}</div>`+
        `<div style="color:#f0a020;font-size:.78rem;margin-top:4px">${L.surpriseCaveat.replace("{fav}",m.fav)}</div>`+
        `<div style="font-size:.76rem;color:var(--mut);margin-top:4px">${L.surpriseEvidence.replace("{n}",si.quality_matches)} (${evTxt})</div>`+
        `${cav}</div>`;
    });
    const sDone=(SURPRISE.completed||[]).filter(m=>m.surprise);
    if(sDone.length){ const hit=sDone.filter(m=>m.upset).length;
      h += `<div style="font-size:.84rem;color:var(--mut);margin-top:6px">${L.surpriseDone}: ${hit}/${sDone.length}</div>`; }
    sp2.innerHTML = h;
  } else { sp2.innerHTML = ""; }

  // matches
  const box = document.getElementById("matches");
  box.innerHTML = "";
  PREDICTIONS.forEach(p=>{
    const isCall = (p.verdict==="call");
    const div = document.createElement("div");
    div.className = "match" + (isCall ? "" : " silent");
    let resultHtml = "";
    if(p.result){
      let cls="", label="";
      if(!isCall){ cls=""; label=L.noScore; }
      else if(p.correct==="1"){ cls="ok"; label=L.correct; }
      else { cls="miss"; label=L.wrong; }
      resultHtml = `<div class="result"><span class="${cls}">${L.result}${p.result} ${label}</span></div>`;
    }
    div.innerHTML = `
      <div class="mdate">${fmtDate(p.date)}</div>
      <div class="mtop">
        <span class="teams">${p.home} <span style="color:var(--mut)">–</span> ${p.away}</span>
        <span class="verdict ${isCall?'call':'silent'}">${isCall ? (p.fav+" "+pct(p.fp)) : L.silent}</span>
      </div>
      <div class="bars">
        <div class="bar-h" style="width:${p.ph*100}%"></div>
        <div class="bar-d" style="width:${p.pd*100}%"></div>
        <div class="bar-a" style="width:${p.pa*100}%"></div>
      </div>
      <div class="probs">
        <span>${L.home} <b>${pct(p.ph)}</b></span>
        <span>${L.draw} <b>${pct(p.pd)}</b></span>
        <span>${L.away} <b>${pct(p.pa)}</b></span>
      </div>
      ${resultHtml}`;
    box.appendChild(div);
  });
}

function openHowto(){
  var d = document.getElementById('howto');
  if(d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); }
}

document.getElementById("langToggle").addEventListener("click",()=>{
  lang = (lang==="en") ? "he" : "en"; render();
});
render();
</script>
