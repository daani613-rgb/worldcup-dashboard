<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Unified board</title>
<style>
  :root{   /* תיקון 1: ערכת-כהה כמו האתר-הישן */
    --ink:#e8eaed; --ink2:#c2cad4; --muted:#9aa0aa; --line:#2a2f3a;
    --paper:#0f1115; --card:#1a1d24;
    --gold:#d6a447; --green:#3fb56a; --red:#e0594f;
    --blue:#3b82f6; --slate:#7a8a99; --orange:#d9742e; --teal:#2b8a8a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Heebo','Segoe UI',Arial,sans-serif;line-height:1.6;
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 70px;position:relative}
  .toggle{position:absolute;top:14px;inset-inline-end:14px;cursor:pointer;background:var(--card);
    border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 11px;
    font-family:inherit;font-size:13px;font-weight:700;z-index:3}
  .toggle:hover{background:#262c38}
  .top{padding:8px 4px 14px}
  .eyebrow{font-size:12px;letter-spacing:.13em;color:var(--gold);font-weight:700;margin:0 0 6px}
  h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
  .top p{margin:0;font-size:13.5px;color:var(--ink2)}

  .guide-btn{margin-top:12px;display:inline-flex;align-items:center;gap:7px;background:#262c38;color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-family:inherit;font-size:14px;font-weight:700;
    cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .guide-btn:hover{background:#2f3744}
  .guide-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  .tr{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
  .tr .t{flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tr .lbl{font-size:11px;color:var(--muted);font-weight:600}
  .tr .val{font-size:19px;font-weight:800;margin-top:2px}
  .tr .sub{font-size:10.5px;color:var(--muted);font-weight:600}
  .tr .t.f{border-right:3px solid var(--orange)} .tr .t.s{border-right:3px solid var(--teal)}
  .tr .t.v{border-right:3px solid var(--green)} .tr .t.w{border-right:3px solid var(--red)}
  .calib{font-size:11.5px;color:var(--muted);margin:6px 4px 0}

  .daylbl{font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 4px 2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px 13px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .card.decided{background:#15181f}
  .expl-card{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--blue);border-radius:14px;padding:14px 16px;margin:14px 0 0}
  .expl-card .lbl{font-size:11px;color:var(--muted);font-weight:600}
  .expl-card .val{font-size:22px;font-weight:800;margin-top:2px}
  .expl-card .sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
  .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
  .teams{font-size:16.5px;font-weight:800}
  .when{font-size:12px;color:var(--muted);margin-top:2px}
  .flags{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
  .flag{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .flag.fire{background:#2a1d0e;color:#f0b070} .flag.scale{background:#10221f;color:#5cc0b0}

  .barrow{display:flex;align-items:center;gap:10px;margin:5px 0}
  .barlbl{flex:0 0 54px;font-size:13px;font-weight:700;text-align:left}
  .barlbl small{display:block;font-size:9.5px;color:var(--muted);font-weight:500}
  .bar{flex:1;display:flex;height:28px;border-radius:5px;overflow:hidden}
  .seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .market .seg{opacity:.5}
  .seg.pick{box-shadow:inset 0 0 0 2.5px var(--ink);z-index:2}
  .seg.zv{box-shadow:inset 0 0 0 2.5px var(--green);z-index:2}
  .seg.zw{box-shadow:inset 0 0 0 2.5px var(--red);z-index:2}
  .seg.zc{box-shadow:inset 0 0 0 2.5px #3ad0c0;z-index:2}   /* טבעת-הבר לאזור-הפער: תכלת */
  .axis{display:flex;margin-top:1px;padding-right:64px}
  .axis span{font-size:10px;color:var(--muted);text-align:center}

  .pickline{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .pickline .who{font-size:14px}.pickline .who b{font-weight:800}
  .conf{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .conf.hi{background:#13251a;color:#4ade80}.conf.mid{background:#2a2113;color:#e0b070}.conf.lo{background:#1e2128;color:#9aa0aa}

  .zone{margin-top:8px;font-size:13px;border-radius:9px;padding:7px 11px;font-weight:700;line-height:1.45}
  .zone.v{background:#13251a;border:1px solid #1e5e3a;color:#7ee2a8}
  .zone.w{background:#2a1416;border:1px solid #6a2a2e;color:#f4a0a0}
  .zone.c{background:#0f2a2c;border:1px solid #2b8a8a;color:#6fd6cf}   /* פער-גדול: תכלת/teal (מידע) — מובחן מכחול-הבית #3b82f6 */
  .zone.n{background:#1c2028;border:1px solid var(--line);color:#aab2bd;font-weight:600}
  .zone small{display:block;font-weight:600;opacity:.85;margin-top:1px}

  details.sf{margin-top:9px;border:1px solid #4a3a1e;border-radius:10px;background:#1f1810;overflow:hidden}
  details.sf summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:13px;font-weight:700;color:#e0b070;display:flex;justify-content:space-between;align-items:center}
  details.sf summary::-webkit-details-marker{display:none}
  details.sf[open] .sfchev{transform:rotate(180deg)}
  .sfbody{padding:2px 12px 12px}
  .sfmeta{font-size:12.5px;color:#cBa878;margin:2px 0 8px}.sfmeta b{color:#f0c088}
  .sfnotelose{margin-top:8px;text-align:center;font-size:13px;font-weight:800;color:var(--ink);background:#14171e;border:1px solid var(--line);border-radius:8px;padding:8px}
  .sfnote{font-size:11.5px;color:#c0a878;margin-top:6px}
  /* תיקון 3: שורת-פער-ערך — ירוק מעומעם/מנוקד (לא ירוק-מלא), עם "לא מוכח" */
  .vgap{margin-top:8px;border:1px dashed #2e7d4a;background:#10201a;border-radius:8px;padding:7px 10px;font-size:12.5px;color:#7ec9a0;font-weight:700}
  .vgap small{display:block;font-weight:500;color:#8c9aa0;margin-top:3px;font-size:11px;line-height:1.45}

  .verdicts{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
  .score{font-size:13px;color:var(--ink2);margin-bottom:3px}.score b{color:var(--ink)}
  .vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0}
  .vrow .what{color:var(--ink2)}.vrow .what b{color:var(--ink);font-weight:700}
  .vmark{font-weight:800;font-size:13px;white-space:nowrap}
  .vmark.ok{color:#4ade80}.vmark.miss{color:#f87171}.vmark.neu{color:var(--muted)}
  .brier{font-size:11.5px;color:var(--muted);margin-top:4px}
  .pend{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
  footer{margin-top:24px;text-align:center;font-size:12px;color:var(--muted)}

  /* ===== guide modal ===== */
  .modal{position:fixed;inset:0;background:rgba(21,33,46,.55);z-index:50;display:none;
    padding:20px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .modal.open{display:block}
  .modal-card{max-width:760px;margin:0 auto;background:var(--paper);border-radius:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.3);padding:0 0 30px;position:relative}
  .modal-head{position:sticky;top:0;background:#11151c;color:var(--ink);border-radius:18px 18px 0 0;border-bottom:1px solid var(--line);
    padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .modal-head .mt{font-size:16px;font-weight:800}
  .modal-close{background:rgba(255,255,255,.14);color:#fff;border:none;width:34px;height:34px;border-radius:50%;
    font-size:20px;cursor:pointer;line-height:1;display:grid;place-items:center}
  .modal-close:hover{background:rgba(255,255,255,.28)}
  .guide{padding:6px 20px 0}
  .guide .sec{padding:24px 0;border-bottom:1px solid var(--line)}
  .guide .sec:last-child{border-bottom:none}
  .guide .ey{display:flex;align-items:baseline;gap:9px;margin:0 0 12px}
  .guide .num{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.05em}
  .guide h2{font-size:19px;margin:0;font-weight:800}
  .guide p{margin:0 0 11px;font-size:14.5px;color:var(--ink2)}
  .guide p b,.guide li b{color:var(--ink);font-weight:700}
  .guide .lead{font-size:15px;color:var(--ink)}
  .guide ul{margin:6px 0 11px;padding-inline-start:0;list-style:none}
  .guide li{position:relative;padding-inline-start:18px;margin:6px 0;font-size:14.5px;color:var(--ink2)}
  .guide li::before{content:"";position:absolute;inset-inline-start:3px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .guide .fig{background:#14171e;border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0}
  .guide .cap{font-size:12px;color:var(--muted);margin-top:9px;text-align:center}
  .guide svg{display:block;width:100%;height:auto}
  .guide .swatch{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-1px;margin-inline-start:6px}
  .guide .gchip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .guide .gchip.v{background:#13251a;color:#7ee2a8}.guide .gchip.w{background:#2a1416;color:#f4a0a0}
  .guide .gchip.c{background:#0f2a2c;color:#6fd6cf}.guide .gchip.n{background:#1c2028;color:#aab2bd}
  .guide .gchip.fire{background:#2a1d0e;color:#f0b070}.guide .gchip.scale{background:#10221f;color:#5cc0b0}
  .guide .callout{background:#14171e;border:1px solid var(--gold);border-inline-end:4px solid var(--gold);border-radius:10px;padding:12px 14px;margin:13px 0;font-size:14px;color:var(--ink2)}
  .guide .callout.warn{border-color:var(--red);border-inline-end-color:var(--red)}
  .guide .callout b{color:var(--ink)}
  @media (max-width:430px){ .seg{font-size:10.5px} .teams{font-size:15px} .barlbl{flex-basis:48px} .guide h2{font-size:17px} }
</style>
</head>
<body>
<div class="wrap">
  <button class="toggle" id="langToggle" onclick="toggleLang()">עב</button>
  <div class="top">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="h1"></h1>
    <p id="intro"></p>
    <p id="subtitle" style="margin:6px 0 0;font-size:12.5px;color:var(--muted);font-weight:600"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="guide-btn" id="guideBtn" onclick="openGuide()"></button>
      <a class="guide-btn" id="todayBtn" href="#today" style="background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none"></a>
    </div>
  </div>

  <!-- תיקון 2: בלוק מלל-המנוע בתוך כרטיס מעוגל יפה (כמו האתר-הישן). תיקון 1: הפסקאות המלאות. -->
  <div class="expl-card">
    <div class="lbl" id="hold-lbl"></div>
    <div class="val" id="hold-win">—</div>
    <div class="sub" id="hold-sub"></div>
    <div id="acc-detail" style="font-size:11.5px;color:var(--ink2);line-height:1.5;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)"></div>
  </div>

  <div class="tr">
    <div class="t"><div class="lbl" id="lbl-win"></div><div class="val" id="acc-win">—</div><div class="sub" id="n-win"></div></div>
    <div class="t f"><div class="lbl" id="lbl-fire"></div><div class="val" id="acc-fire">—</div><div class="sub" id="n-fire"></div></div>
    <div class="t s"><div class="lbl" id="lbl-scale"></div><div class="val" id="acc-scale">—</div><div class="sub" id="n-scale"></div></div>
    <div class="t v"><div class="lbl" id="lbl-clv"></div><div class="val" id="acc-clv">—</div><div class="sub" id="n-clv"></div></div>
    <div class="t w"><div class="lbl" id="lbl-warn"></div><div class="val" id="acc-warn">—</div><div class="sub" id="n-warn"></div></div>
  </div>
  <p class="calib" id="calib"></p>

  <div class="daylbl" id="daylbl"></div>
  <div class="expl-card" id="surprise-note" style="margin:8px 0 2px;border-inline-start-color:var(--orange);font-size:13px;color:var(--ink2);line-height:1.5"></div>
  <div id="cards"></div>
  <footer id="footer"></footer>
</div>

<!-- ===== guide modal ===== -->
<div class="modal" id="guide-modal" onclick="if(event.target===this)closeGuide()">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head"><span class="mt" id="guideTitle"></span>
      <button class="modal-close" onclick="closeGuide()" aria-label="close">×</button></div>
    <div class="guide" id="guideBody"></div>
  </div>
</div>

<script>
const COL={h:'#3b82f6',d:'#a855f7',a:'#ef4444'};   // תיקון 3: צבעי-האתר-הישן — בית=כחול · תיקו=סגול · חוץ=אדום
const LO=3, HI=10;

  <div class="sec"><div class="ey"><span class="num">01</span><h2>The idea in one line</h2></div>
    <p class="lead">The engine has "what a side is worth" (a probability). The market has "what a side costs" (the line). The board shows both, one above the other, and looks for the gap — not a better prediction, but a better price than the side is worth.</p>
    <p>On top of that, after every match the board checks itself: was the call right, did the flags come true, and did the value bet profit.</p></div>

  <div class="sec"><div class="ey"><span class="num">02</span><h2>The two bars: engine vs market</h2></div>
    <ul>
      <li><b>Top bar — the engine ("what it's worth").</b> The calibrated probability for each outcome: home/draw/away. Sums to 100%.</li>
      <li><b>Bottom bar — the market ("what it costs").</b> What the line prices after removing the bookmaker's margin (vig). That's "the price".</li>
    </ul>
    <p>Where the engine gives a side <b>more</b> than the market — the side is "cheap", and that's where there may be value.</p>
    <p><span class="swatch" style="background:#3b82f6"></span>Home &nbsp; <span class="swatch" style="background:#a855f7"></span>Draw &nbsp; <span class="swatch" style="background:#ef4444"></span>Away</p></div>

    <ul>
      <li><b>Dark frame</b> (engine bar) = <b>the engine's call</b> — who wins. The <b>validated</b> layer.</li>
      <li><b>Green frame</b> (market bar) = <b>the value side</b> — where the engine is pricier than the market. The <b>experimental</b> layer.</li>
      <li><b>Red / teal frame</b> = caution zones (section 04).</li>
    </ul>
    <div class="callout"><b>Important:</b> the call (dark) says "who wins"; value (green) says "where the price is wrong". They can point to different sides — and that's fine.</div></div>

  surpriseTitle:"🔥 התראות הפתעה", surpriseSub:"פייבוריט ברור מול מאאוטסיידר חם — סיכוי ההפתעה כמעט מוכפל. לא נבואת ניצחון.",
  holdLbl:"דיוק מאומת (מבחן holdout)", holdIncl:"כולל תיקו", holdVsBase:'מול בסיס "תמיד בית"',
  lblWin:"דיוק חי בטורניר", lblFire:"🔥 הפתעה", lblScale:"⚖️ תיקו",
  lblClv:"💚 ערך · CLV", lblWarn:"🛑 זהירות הצדיקה",
  calib:'⚠️ הערך מסווג לפי <b>גודל-הפער</b> וקיום <b>הסבר</b>: ירוק=ערך · אדום=פער-גדול-מטעות-מנוע · תכלת=פער-גדול-ללא-הסבר (בדוק) · אפור=קטן-מדי. לפירוט מלא — הכפתור למעלה.',
  daylbl:"משחקים", footer:"לוח מאוחד · קריאה (מאומת) + ערך-מול-שוק לפי-אזורים (ניסיוני)",
  na:"טרם", staked:"סטאפים", silNot:"שתיקות (לא נספרות)", pending:"ממתינות", noCalls:"טרם הוכרעו קריאות",
  side:{h:"בית",d:"תיקו",a:"חוץ"}, conf:["ביטחון גבוה","ביטחון בינוני","ביטחון נמוך"],
  grade:{2:"מתון (15%)",3:"בינוני (16%)",4:"גבוה (18%)"},
  flagFire:"🔥 הפתעה", flagScale:"⚖️ נוטה לתיקו",
  engLbl:"המנוע", engSub:"מה שווה", mktLbl:"השוק", mktSub:"מה עולה",
  who:"קריאה:", stage:"שלב הבתים", vs:"נגד",
  engShort:"מנוע", vsShort:"מול", mktShort:"שוק", gap:"פער",
  zVal:"ערך", zValBig:"ערך גדול מוסבר", zCheck:"פער גדול",
  zHeavy:"קריאה בלבד — מועדף-כבד (השוק שמרן)",
  zNoValue:"אין ערך (פער מתחת ל-3%)",
  zvWindow:"בתוך החלון 3–10% — אמין ובר-מימוש",
  honesty:"💚 ערך = השערה למדידה, לא רווח מובטח. ה-CLV יכריע.",
  zbSmall:"פער גדול עם בסיס מבני",
  zwSmall:"שתיקה, ובדוק את המודל",
  zcSmall:"המנוע והשוק חלוקים מהותית על המשחק הזה. ייתכן ערך, ייתכן טעות-מנוע — שאלה פתוחה. ה-CLV יכריע.",
  zoneNoMkt:'אין נתוני-שוק עדיין (לא נמצאו odds ביומן) — <b>קריאה בלבד</b>',
  sfSummary:"🔥 פירוט גורם-ההפתעה", sfByRank:"לפי דירוג", sfByForm:"לפי טופס",
  sfBarLbl:"הפתעה", sfBarSub:"לפי הטופס",
  sfNoteloseA:"הסיכוי ש", sfNoteloseB:"לא תפסיד (ניצחון או תיקו):",
  sfNote1:"טופס חם = ניצח לאחרונה קבוצות חזקות (מבוסס 5 משחקים אחרונים מול חזקות).",
  sfNote2a:"⚠️ דגל-הטיה, לא נבואה —", sfNote2b:"עדיין המועדפת.",
  vgLabel:"💚 פער-ערך על", vgUnproven:"(לא מוכח)", vgSurprise:"הפתעה",
  vgWarn:"גיבוי אנדרדוג-חם הוא edge שלא הוכח (היסטורית אף שלילי) — ה-CLV יכריע אם זה אמיתי.",
  vNeu:"— ניטרלי (לא בוחר תיקו)", vCallOk:"✓ צדקנו", vCallMiss:"✗ טעינו", vCall:"הקריאה:",
  vFireA:"🔥 הפתעת", vFireB:"", vFireOk:"✓ התממשה", vFireMiss:"✗ לא הפעם",
  vScale:"⚖️ נוטה-לתיקו", vScaleOk:"✓ יצא תיקו", vScaleMiss:"✗ לא תיקו",
  vBet:"💚 ערך על", vBetOk:"✓ זכה", vBetMiss:"✗ הפסיד",
  vCaut:"זהירות (שתקנו על הפער)", vCautMiss:"✗ המנוע צדק — החמצנו", vCautOk:"✓ הצדיקה — השוק צדק",
  vResult:"תוצאה:", vBrier:"Brier למשחק:", vBrierTail:"(נמוך=טוב)",
  vPriceOk:"✓ מחיר נסגר לטובתנו", vWin:"זכייה", vWinPend:"— ממתין למשחק",
  vPregameNote:"ה-CLV נסגר עם הקו, לפני המשחק. הזכייה תיבדק אחרי התוצאה.",
  pendNotPlayed:"טרם שוחק", pendCaut:"הזהירות תיבדק", pendCall:"הקריאה והדגלים ייבדקו"
 }
};

let lang="en", L=I18N.en;

// ===================== helpers =====================
const pickSide=e=>e.h>=e.a?'h':'a';
const confClass=p=>p>=65?'hi':(p>=50?'mid':'lo');
const confLabel=p=>p>=65?L.conf[0]:(p>=50?L.conf[1]:L.conf[2]);
const brier=(e,o)=>{const y={h:o==='h',d:o==='d',a:o==='a'};return ((e.h/100-y.h)**2+(e.d/100-y.d)**2+(e.a/100-y.a)**2).toFixed(3);};
// תיקון 2: צד-הפער = הצד עם הפער החיובי הגדול ביותר — לפי הפער עצמו, לא לפי 🔥/⚖️.
function gapSide(m){ let best='h',bd=-999; for(const s of'hda'){const g=m.eng[s]-m.mkt[s];if(g>bd){bd=g;best=s;}} return best; }
function classify(m){ if(!m.mkt)return{zone:'nomarket',side:pickSide(m.eng),gap:0};   // אין נתוני-שוק → קריאה בלבד
  const s=gapSide(m),gap=m.eng[s]-m.mkt[s];
  if(m.eng[s]>80)return{zone:'heavyfav',side:s,gap};   // תיקון 2#5: מועדף-כבד → קריאה בלבד (פער-גדול צפוי, השוק שמרן)
  if(gap<LO)return{zone:'silence',side:s,gap}; if(gap<=HI)return{zone:'value',side:s,gap};
  if(m.engine_error)return{zone:'warn',side:s,gap}; if(m.explained)return{zone:'value_big',side:s,gap};
  return{zone:'check',side:s,gap}; }
const isBet=z=>z==='value'||z==='value_big';
const isCaution=z=>z==='warn'||z==='check';
function fmtDate(d){const p=String(d).split("-");if(p.length!==3)return d;
  return lang==="he"?(+p[2])+"."+(+p[1]):(+p[1])+"/"+(+p[2]);}   // he: 15.6 (יום.חודש) · en: 6/15 (month/day)
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString(lang==="he"?"he-IL":"en-GB",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}

function cardHTML(m){
  const pk=pickSide(m.eng), pkP=m.eng[pk], teamName=pk==='h'?m.home:m.away;
  const cl=classify(m), z=cl.zone, vs=cl.side, gap=cl.gap;
  const ringCls=isBet(z)?'zv':(z==='warn'?'zw':(z==='check'?'zc':''));
  let flags='';
  if(m.fire)  flags+=`<span class="flag fire">${L.flagFire}</span>`;
  if(m.scale) flags+=`<span class="flag scale">${L.flagScale}</span>`;
  const barEng=['h','d','a'].map(s=>`<div class="seg ${s===pk?'pick':''}" style="flex:${m.eng[s]};background:${COL[s]}">${m.eng[s]}%</div>`).join('');
  const barMkt=m.mkt?['h','d','a'].map(s=>`<div class="seg ${(ringCls&&s===vs)?ringCls:''}" style="flex:${m.mkt[s]};background:${COL[s]}">${m.mkt[s]}%</div>`).join(''):'';
  const honesty=`<div style="font-size:11px;font-weight:600;color:#7c8a98;margin-top:5px">${L.honesty}</div>`;
  // תיקון 2#3: המספר תמיד מוצג — "{צד} ({קבוצה}): מנוע X% מול שוק Y% · פער +Z%"
  const teamS = vs==='h'?m.home : (vs==='a'?m.away : L.side.d);
  const fact = m.mkt ? `${L.side[vs]} (${teamS}): ${L.engShort} ${m.eng[vs]}% ${L.vsShort} ${L.mktShort} ${m.mkt[vs]}% · ${L.gap} ${gap>=0?'+':''}${gap}%` : '';
  let zone;
  if(z==='nomarket')       zone=`<div class="zone n">${L.zoneNoMkt}</div>`;
  else if(z==='value')     zone=`<div class="zone v">💚 ${L.zVal} · ${fact}<small>${L.zvWindow}</small>${honesty}</div>`;
  else if(z==='value_big') zone=`<div class="zone v">💚 ${L.zValBig} · ${fact}<small>${m.explained} → ${L.zbSmall}</small>${honesty}</div>`;
  else if(z==='warn')      zone=`<div class="zone w">🛑 ${fact}<small>${m.engine_error} → ${L.zwSmall}</small></div>`;
  else if(z==='check')     zone=`<div class="zone c">⚠️ ${L.zCheck} +${gap}% · ${L.side[vs]} (${teamS}): ${L.engShort} ${m.eng[vs]}% ${L.vsShort} ${L.mktShort} ${m.mkt[vs]}%<small>${L.zcSmall}</small></div>`;
  else if(z==='heavyfav')  zone=`<div class="zone n">${fact}<small>${L.zHeavy}</small></div>`;
  else                     zone=`<div class="zone n">${fact}<small>${L.zNoValue}</small></div>`;   // silence (gap<3%)

  // surprise-factor section: second distribution bar (by form), separate from the engine
  let sf='';
  if(m.surprise){
    const sd=m.surprise.dist;
    const sb=['h','d','a'].map(s=>`<div class="seg" style="flex:${sd[s]};background:${COL[s]}">${sd[s]}%</div>`).join('');
    const udName=(m.fire_side||'a')==='a'?m.away:m.home;
    const grade=L.grade[m.surprise.score]||m.surprise.byForm||'';
    const vg=m.surprise.valueGap;   // תיקון 3: שורת-פער-ערך (תצוגה בלבד · חושב ב-board_build · לא ב-CLV/סיווג)
    const vgRow=vg?`<div class="vgap">${L.vgLabel} ${vg.dog} ${L.vgUnproven}: ${L.vgSurprise} ${vg.sp}% ${L.vsShort} ${L.mktShort} ${vg.mk}% · +${vg.gap}%<small>${L.vgWarn}</small></div>`:'';
    sf=`<details class="sf"><summary>${L.sfSummary} <span class="sfchev" style="font-size:11px">▾</span></summary>
      <div class="sfbody">
        <div class="sfmeta">${L.sfByRank}: <b>${m.surprise.byRanking}%</b> · ${L.sfByForm}: <b>${grade}</b></div>
        <div class="barrow"><div class="barlbl">${L.sfBarLbl}<small>${L.sfBarSub}</small></div><div class="bar">${sb}</div></div>
        <div class="axis"><span style="flex:${sd.h}">${L.side.h}</span><span style="flex:${sd.d}">${L.side.d}</span><span style="flex:${sd.a}">${L.side.a}</span></div>
        <div class="sfnotelose">${L.sfNoteloseA} ${udName} ${L.sfNoteloseB} ${m.surprise.notLose}%</div>
        ${vgRow}
        <div class="sfnote">${L.sfNote1}</div>
        <div class="sfnote">${L.sfNote2a} ${teamName} ${L.sfNote2b}</div>
      </div></details>`;
  }

  let tail, decided=!!m.result;
  if(decided){
    const o=m.result.outcome;
    let mainMark=(o==='d')?`<span class="vmark neu">${L.vNeu}</span>`
      :(o===pk?`<span class="vmark ok">${L.vCallOk}</span>`:`<span class="vmark miss">${L.vCallMiss}</span>`);
    let rows=`<div class="vrow"><span class="what">${L.vCall} <b>${teamName}</b> (${pkP}%)</span>${mainMark}</div>`;
    if(m.fire){const ud=m.fire_side||'a';const dogN=ud==='a'?m.away:m.home;const sp=(o===ud||o==='d');
      const lbl=lang==='he'?`${L.vFireA} ${dogN}`:`${L.vFireA} ${dogN} ${L.vFireB}`;
      rows+=`<div class="vrow"><span class="what">${lbl}</span>${sp?`<span class="vmark ok">${L.vFireOk}</span>`:`<span class="vmark miss">${L.vFireMiss}</span>`}</div>`;}
    if(m.scale)
      rows+=`<div class="vrow"><span class="what">${L.vScale}</span>${o==='d'?`<span class="vmark ok">${L.vScaleOk}</span>`:`<span class="vmark miss">${L.vScaleMiss}</span>`}</div>`;
    if(isBet(z)){const won=(o===vs);const clvTxt=(m.clv!=null)?` · CLV +${m.clv}%`:'';
      rows+=`<div class="vrow"><span class="what">${L.vBet} ${L.side[vs]}${clvTxt}</span>${won?`<span class="vmark ok">${L.vBetOk}</span>`:`<span class="vmark miss">${L.vBetMiss}</span>`}</div>`;}
    if(isCaution(z)){const cameIn=(o===vs);
      rows+=`<div class="vrow"><span class="what">${z==='warn'?'🛑':'⚠️'} ${L.vCaut}</span>`+
        (cameIn?`<span class="vmark miss">${L.vCautMiss}</span>`:`<span class="vmark ok">${L.vCautOk}</span>`)+`</div>`;}
    tail=`<div class="verdicts"><div class="score">${L.vResult} <b>${L.side[o]} ${m.result.score}</b></div>${rows}
      <div class="brier">${L.vBrier} ${brier(m.eng,o)} ${L.vBrierTail}</div></div>`;
  } else if(isBet(z) && m.clv!=null){
    tail=`<div class="verdicts">
      <div class="vrow"><span class="what">${L.vBet} ${L.side[vs]} · CLV +${m.clv}% <span class="vmark ok">${L.vPriceOk}</span></span></div>
      <div class="vrow"><span class="what">${L.vWin}</span><span class="vmark neu">${L.vWinPend}</span></div>
      <div class="brier" style="margin-top:6px">${L.vPregameNote}</div></div>`;
  } else {
    tail=`<div class="pend">${L.pendNotPlayed} · ${isCaution(z)?L.pendCaut:L.pendCall}</div>`;
  }
  const when=`${fmtDate(m.date||m.when)}${m.iso?' · '+fmtTime(m.iso):''} · ${L.stage}`;
  return `<div class="card ${decided?'decided':''}"${m.today?' id="today"':''}>
    <div class="chead"><div><div class="teams">${m.home} <span style="color:#94a3b8;font-weight:600">${L.vs}</span> ${m.away}</div>
      <div class="when">${when}</div></div><div class="flags">${flags}</div></div>
    <div class="barrow"><div class="barlbl">${L.engLbl}<small>${L.engSub}</small></div><div class="bar">${barEng}</div></div>
    ${m.mkt?`<div class="barrow"><div class="barlbl">${L.mktLbl}<small>${L.mktSub}</small></div><div class="bar market">${barMkt}</div></div>`:''}
    <div class="axis"><span style="flex:${m.eng.h}">${L.side.h}</span><span style="flex:${m.eng.d}">${L.side.d}</span><span style="flex:${m.eng.a}">${L.side.a}</span></div>
    <div class="pickline"><div class="who">${L.who} <b>${teamName}</b></div><span class="conf ${confClass(pkP)}">${confLabel(pkP)} · ${pkP}%</span></div>
    ${zone}${sf}${tail}</div>`;
}

function renderTracks(){
  const dec=matches.filter(m=>m.result);
  const fireDec=dec.filter(m=>m.fire), fireHit=fireDec.filter(m=>{const u=m.fire_side||'a';return m.result.outcome===u||m.result.outcome==='d';}).length;
  const scaleDec=dec.filter(m=>m.scale), scaleHit=scaleDec.filter(m=>m.result.outcome==='d').length;
  const betAll=matches.filter(m=>isBet(classify(m).zone));
  const clvs=betAll.filter(m=>m.clv!=null).map(m=>m.clv);
  const cautDec=dec.filter(m=>isCaution(classify(m).zone));
  const cautOK=cautDec.filter(m=>m.result.outcome!==classify(m).side).length;
  const setTR=(id,hit,n)=>{document.getElementById('acc-'+id).textContent=n?Math.round(100*hit/n)+'%':'—';
    document.getElementById('n-'+id).textContent=n?`${hit}/${n}`:L.na;};
  setTR('fire',fireHit,fireDec.length); setTR('scale',scaleHit,scaleDec.length);
  setTR('warn',cautOK,cautDec.length);
  if(clvs.length){const a=clvs.reduce((x,y)=>x+y,0)/clvs.length;
    document.getElementById('acc-clv').textContent='+'+a.toFixed(1)+'%';
    document.getElementById('n-clv').textContent=`${clvs.length} ${L.staked}`;}
  else{document.getElementById('acc-clv').textContent='—';document.getElementById('n-clv').textContent=L.na;}

  // Validated accuracy (holdout · static) — injected from DATA.holdout, not recomputed
  const H=DATA.holdout||{};
  document.getElementById('hold-win').textContent=(H.accWin||'—')+'%';
  document.getElementById('hold-sub').innerHTML=`${L.holdIncl} <b>${H.accAll||'—'}%</b> · Brier ${H.brier||'—'} · RPS ${H.rps||'—'}<br>${L.holdVsBase} ${H.baseWin||'—'}%`;

  // Live tournament accuracy — from live TRACK (decided calls; silences not counted; draw=neutral)
  const TR=DATA.track||{};
  const td=TR.calls_decided||0, tc=TR.calls_correct||0;
  document.getElementById('acc-win').textContent=td?Math.round(100*tc/td)+'%':'—';
  document.getElementById('n-win').textContent=td?`${tc}/${td} · ${TR.silences||0} ${L.silNot} · ${TR.pending||0} ${L.pending}`:L.noCalls;
}

function applyChrome(){
  document.getElementById('langToggle').textContent=L.toggle;
  document.getElementById('eyebrow').textContent=L.eyebrow;
  document.getElementById('h1').textContent=L.h1;
  document.getElementById('intro').textContent=L.intro;
  document.getElementById('subtitle').textContent=L.subtitle;
  document.getElementById('guideBtn').textContent=L.guideBtn;
  document.getElementById('todayBtn').textContent=L.todayBtn;
  document.getElementById('hold-lbl').textContent=L.holdLbl;
  document.getElementById('acc-detail').innerHTML=`<div>${L.accDesc}</div><div style="margin-top:4px">${L.acc2Desc}</div><div style="margin-top:4px">${L.brierDesc}</div>`;
  document.getElementById('surprise-note').innerHTML=`<b>${L.surpriseTitle}</b> · ${L.surpriseSub}`;
  document.getElementById('lbl-win').textContent=L.lblWin;
  document.getElementById('lbl-fire').textContent=L.lblFire;
  document.getElementById('lbl-scale').textContent=L.lblScale;
  document.getElementById('lbl-clv').textContent=L.lblClv;
  document.getElementById('lbl-warn').textContent=L.lblWarn;
  document.getElementById('calib').innerHTML=L.calib;
  document.getElementById('daylbl').textContent=L.daylbl;
  document.getElementById('footer').textContent=L.footer;
  document.getElementById('guideTitle').textContent=L.guideTitle;
  document.getElementById('guideBody').innerHTML=L.guideHTML;
}

function render(){
  L=I18N[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==='he')?'rtl':'ltr';
  applyChrome();
  document.getElementById('cards').innerHTML=matches.map(cardHTML).join('');
  renderTracks();
}
function toggleLang(){ lang=(lang==='en')?'he':'en'; render(); }

// ===== modal =====
function openGuide(){document.getElementById('guide-modal').classList.add('open');document.body.style.overflow='hidden';}
function closeGuide(){document.getElementById('guide-modal').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeGuide();});

render();
</script>
</body>
</html>
