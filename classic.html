  .probs{direction:ltr}

  .result .score{color:var(--txt);font-weight:600;margin-inline-end:6px}

  .so{background:#f0a020} .sd{background:var(--draw)} .sf{background:var(--mut)}

  .sbig{font-size:2rem;font-weight:700;color:#f0a020;line-height:1.1}

  .smini{height:7px;border-radius:4px;background:#0c0e12;overflow:hidden;direction:ltr}

  .probs span b{color:var(--txt)}

let lang = "en";
function t(k){return I18N[lang][k]}
function pct(x){return Math.round(x*100)+"%"}
function fmtDate(s){ const p=String(s).split("-"); if(p.length!==3) return s;
  return (lang==="he") ? p[2]+"."+p[1] : p[1]+"."+p[2]; }   // he: 15.06 (יום.חודש) · en: 06.15 (חודש.יום)

function render(){
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang==="he") ? "rtl" : "ltr";
  document.getElementById("title").textContent = L.title;
  document.getElementById("subtitle").textContent = L.subtitle;
  document.getElementById("howtoHint").textContent = L.howtoHint;
  document.getElementById("langToggle").textContent = (lang==="en") ? "עב" : "EN";
  document.getElementById("lgHome").textContent = L.lgHome;
  document.getElementById("lgDraw").textContent = L.lgDraw;
  document.getElementById("lgAway").textContent = L.lgAway;
  document.getElementById("howTitle").textContent = L.howTitle;
  ["howFavTitle","howFav","howAplusTitle","howAplus","howSilentTitle","howSilent",
   "howSurpriseTitle","howSurprise","howSurpriseNot","howEvidenceTitle","howEvidence",
   "howResultsTitle","howResults","howCaveatTitle","howCaveat"].forEach(k=>{
    const el = document.getElementById(k); if(el) el.textContent = L[k];
  });

  // freshness banner
  const fb = document.getElementById("freshBanner");
  if(FRESH.status==="stale"){ fb.className="fresh stale"; fb.textContent = L.stale + FRESH.updated; }
  else { fb.className="fresh"; fb.textContent = L.fresh + FRESH.updated; }

  // pre/live banner
  document.getElementById("banner").textContent = TOURNAMENT_STARTED ? L.bannerLive : L.bannerPre;
  document.getElementById("matchesHead").textContent = L.matchesHead;

  // track record (calls only, with n; never cherry-picked)
  const tp = document.getElementById("trackPanel");
  if(TRACK.calls_decided>0){
    const acc = Math.round(TRACK.calls_correct/TRACK.calls_decided*100);
    tp.innerHTML = `<h2 class="secth">${L.trackTitle}</h2>
      <div class="big">${acc}%</div>
      <div class="n">${TRACK.calls_correct}${L.of}${TRACK.calls_decided}` +
      ` · ${TRACK.silences}${L.silences} · ${TRACK.pending}${L.pending}</div>`;
  } else {
    tp.innerHTML = `<h2 class="secth">${L.trackTitle}</h2><div class="n">${L.noTrack}</div>`;
  }

  // דיוק מאומת (holdout) — שני מספרי-דיוק בשפה ברורה + הזווית ההוגנת (Brier/RPS).
  // נפרד לחלוטין מהתיקון-היבשתי שמסומן על כרטיסי-המשחק.
  const ap = document.getElementById("accPanel");
  ap.innerHTML = `<h2 class="secth">${L.accTitle}</h2>`+
    `<div class="acc-line">${L.accDesc}</div>`+
    `<div class="acc-line">${L.acc2Desc}</div>`+
    `<div class="acc-line fair">${L.brierDesc}</div>`;

  // surprise alerts (🔥) — מציג רק את הדגל + אחוזי-ההפתעה המאומתים, לעולם לא את ה-conf של השכבה
  const sp2 = document.getElementById("surprisePanel");
  const sAlerts = (SURPRISE.upcoming||[]).filter(m=>m.surprise && m.surprise_info);
  if(sAlerts.length){
    let h = `<div style="font-weight:700;margin:14px 0 2px">${L.surpriseTitle}</div>`+
            `<div style="color:var(--mut);font-size:.82rem;margin-bottom:8px">${L.surpriseSub}</div>`+
            `<button class="howto-hint" style="margin-bottom:8px" onclick="document.getElementById('matchesHead').scrollIntoView({behavior:'smooth',block:'start'})">${L.skipToMatches}</button>`;
    sAlerts.forEach(m=>{
      const si=m.surprise_info;
      // כל המספרים מ-BANDS בלבד (אפס Elo)
      const w=si.win_pct, wb=si.win_base, nl=si.notlose_pct;
      const draw=nl-w, favSeg=100-nl;
      if(draw<0){ console.warn("surprise: negative draw band, skipping", m.match); return; }  // עקביות — לא מרנדר
      const M=w/wb;
      const riseTxt = (M>=1.5) ? L.surpriseRise.replace("{M}", Math.round(M)) : L.surpriseRiseFlat;
      const evTxt = (L.evLevels && L.evLevels[si.evidence]) || si.evidence;
      const gapTxt = si.gap_caveat ? ((L.gapNotes && L.gapNotes[si.gap_caveat]) || si.gap_caveat) : "";
      const cav = gapTxt ? `<div style="color:#f0a020;font-size:.78rem;margin-top:4px">⚠️ ${gapTxt}</div>`:"";
      // תווית-דירוג מדורגת לפי ציון-הפתעה 0-3 (אדיטיבי · null-guard: אם אין score → לא מוצג, הדף לא נשבר)
      const sc = Number.isInteger(si.score) ? si.score : null;
      const gradeTxt = (sc!==null && L.upsetGrades && L.upsetGrades[sc]) ? L.upsetGrades[sc] : "";
      const gradeColor = (sc>=4) ? "#e23b3b" : (sc===3 ? "#f0a020" : "#c9b037");   // 4=אדום · 3=כתום · 2=זהב-בהיר
      // שורת-הבהרה: "לפי דירוג" (BANDS · פער-Elo) מול "לפי טופס" (ציון-הפתעה המאומת). null-guard.
      const gradeHtml = gradeTxt
        ? `<div style="font-size:.86rem;margin-top:4px">`+
            `<span style="color:var(--mut)">${L.byRanking}: <b>${w}%</b></span>`+
            `<span style="color:var(--mut)"> · </span>`+
            `<span style="color:${gradeColor};font-weight:700">${L.byForm}: ${gradeTxt}</span>`+
          `</div>`
        : "";
      h += `<div class="scard">`+
        `<div style="font-weight:600">${L.surpriseFlag} · ${fmtDate(m.date)} · ${m.match}</div>`+
        gradeHtml+
        // (2) בר 3-פלחים: מאאוטסיידר=win · תיקו=notlose−win · פייבוריט=100−notlose
        `<div class="slbl" style="color:var(--mut);margin-top:8px"><span>${L.surpriseExpLabel}</span></div>`+
        `<div class="sbar"><div class="so" style="width:${w}%"></div><div class="sd" style="width:${draw}%"></div><div class="sf" style="width:${favSeg}%"></div></div>`+
        `<div class="slbl"><span style="color:#f0a020">${si.dog} <b>${w}%</b></span><span>${L.draw} <b>${draw}%</b></span><span>${m.fav} <b>${favSeg}%</b></span></div>`+
        // (3) קופסה — נמחק המספר-הגדול המטעה (28%/פי-M/רגיל/חם); נשאר רק "לא-תפסיד".
        // המספר-הדירוג (w%) נשמר בשורת-ההבהרה ("לפי דירוג") ובבר 3-הפלחים.
        `<div class="sbox">`+
          `<div style="font-size:.8rem">${L.surpriseNotlose.replace("{dog}",si.dog)} <b>${nl}%</b></div>`+
        `</div>`+
        // (4) למה · (5) סייג · (6) ביסוס
        `<div style="font-size:.8rem;color:var(--mut)">${L.surpriseWhy}</div>`+
        `<div style="color:#f0a020;font-size:.78rem;margin-top:4px">${L.surpriseCaveat.replace("{fav}",m.fav)}</div>`+
        `<div style="font-size:.76rem;color:var(--mut);margin-top:4px">${L.surpriseEvidence.replace("{n}",si.quality_matches)} (${evTxt})</div>`+
        `${cav}</div>`;
    });
    const sDone=(SURPRISE.completed||[]).filter(m=>m.surprise);
    if(sDone.length){
      const hit=sDone.filter(m=>m.upset).length;
      const total=sDone.length;
      h += `<div style="font-size:.84rem;color:var(--mut);margin-top:6px">${L.surpriseDone}</div>`+
           `<div style="font-size:.84rem;color:var(--txt)">${L.surpriseDoneCount.replace("{hit}",hit).replace("{total}",total)}</div>`;
      if(total<5){ h += `<div style="font-size:.76rem;color:var(--mut);margin-top:2px">${L.surpriseDoneEarly}</div>`; }
    }
    sp2.innerHTML = h;
  } else { sp2.innerHTML = ""; }

  // matches
  const box = document.getElementById("matches");
  box.innerHTML = "";
  PREDICTIONS.forEach(p=>{
    const isCall = (p.verdict==="call");
    const div = document.createElement("div");
    div.className = "match" + (isCall ? "" : " silent");
    // תוצאה אחרי משחק: סקור + ✓/✗. ⚠️ תיקו = ניטרלי אפור (לא ✗) — המנוע בכוונה לא בוחר תיקו.
    let resultHtml = "";
    if(p.result){
      const m = String(p.result).match(/(\d+)\D+(\d+)/);
      const hs = m?+m[1]:null, as_ = m?+m[2]:null;
      const isDraw = (hs!==null && hs===as_);
      const score = m ? `${p.home} ${hs}–${as_} ${p.away}` : p.result;
      let cls, label;
      if(isDraw){ cls="neutral"; label=L.drawNote; }          // תיקו — ניטרלי תמיד
      else if(!isCall){ cls="neutral"; label=L.noScore; }
      else if(p.correct==="1"){ cls="ok"; label=L.correct; }
      else { cls="miss"; label=L.wrong; }
      resultHtml = `<div class="result"><span class="score">${score}</span><span class="${cls}">${label}</span></div>`;
    }
    // ניבוי-מנצח: המנוע בוחר בית/חוץ (לעולם לא תיקו). מדגישים את הבר שלו, השניים האחרים עמומים.
    const pickHome = (p.fav===p.home);
    const dimH = pickHome ? "" : " bar-dim", dimA = pickHome ? " bar-dim" : "";
    div.innerHTML = `
      <div class="mdate">${fmtDate(p.date)}</div>
      <div class="mtop">
        <span class="teams">${p.home} <span style="color:var(--mut)">–</span> ${p.away}</span>
        <span class="verdict ${isCall?'call':'silent'}">${isCall ? (p.fav+" "+pct(p.fp)) : L.silent}</span>
      </div>
      <div class="bars">
        <div class="bar-h${dimH}" style="width:${p.ph*100}%"></div>
        <div class="bar-d bar-dim" style="width:${p.pd*100}%"></div>
        <div class="bar-a${dimA}" style="width:${p.pa*100}%"></div>
      </div>
      <div class="probs">
        <span>${L.home} <b>${pct(p.ph)}</b></span>
        <span>${L.draw} <b>${pct(p.pd)}</b></span>
        <span>${L.away} <b>${pct(p.pa)}</b></span>
      </div>
      <div class="pick">→ ${p.fav} ${pct(p.fp)}</div>
      ${p.draw_lean ? `<div class="drawlean">⚖️ ${L.drawLean}</div>` : ""}
      ${p.conf_adjusted ? `<div class="cont">⚠️ ${L.contLabel}<span class="tip" title="${L.contTip}">?</span></div>` : ""}
      ${resultHtml}`;
    box.appendChild(div);
  });
}

function openHowto(){
  var d = document.getElementById('howto');
  if(d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); }
}

document.getElementById("langToggle").addEventListener("click",()=>{
  lang = (lang==="en") ? "he" : "en"; render();
});
render();
</script>
